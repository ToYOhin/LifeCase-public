name: Bug report
description: Report a reproducible problem using synthetic data
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not attach real receipts, messages, addresses, credentials, or Evidence Packs.
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Provide the smallest reproduction with generated or redacted data.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Commands and errors
      description: Include only relevant sanitized output.
